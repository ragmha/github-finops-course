<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub FinOps — Hands-on Labs</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--mute:#8b949e;--acc:#2f81f7;--ok:#3fb950;--bad:#f85149}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);display:grid;grid-template-columns:290px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:17px;margin:0 0 4px}nav p{color:var(--mute);font-size:13px;margin:0 0 12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ok);transform-origin:left;transform:scaleX(0);transition:transform .3s}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:14px}
nav button:hover{background:#1f2630}nav button.on{background:#1f6feb33;outline:1px solid var(--acc)}nav button.done::before{content:"✓ ";color:var(--ok)}
main{padding:32px 48px;max-width:960px}h2{margin:0 0 4px;font-size:28px;line-height:1.2}.meta{color:var(--mute);margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin:16px 0}.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
pre{background:#010409;border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow:auto;position:relative;white-space:pre-wrap;word-break:break-word;font-size:13px}
pre button{position:absolute;top:6px;right:6px;font-size:12px}
button.b{background:#21262d;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}button.b:hover{border-color:var(--acc)}
button.p{background:#238636;border-color:#2ea043}
input{background:#010409;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;width:260px}
.ok{color:var(--ok)}.bad{color:var(--bad)}a{color:#58a6ff}ol li{margin:6px 0}code{background:#6e768133;padding:1px 5px;border-radius:4px;font-size:13px}
.takeaway{background:#3fb95012;border-color:#3fb95055}.real{background:#d2992212;border-color:#d2992255}
@media(max-width:800px){body{display:block}nav{position:static;height:auto}main{padding:20px}}
</style>
</head>
<body>
<nav>
  <h1>GitHub FinOps Labs</h1>
  <p>Hands-on: real <code>gh</code> + <code>jq</code> against a sample bill, then your own.</p>
  <div class="bar"><i id="prog"></i></div>
  <div id="toc"></div>
  <p style="margin-top:16px"><button class="b" onclick="if(confirm('Reset progress?')){localStorage.removeItem(KEY);render()}">Reset progress</button></p>
</nav>
<main id="main"></main>

<script id="core">
// Pure logic: sample data, labs, answers. No DOM — tested by test.mjs.
const Core = (() => {
  const r2 = n => Math.round(n * 100) / 100;
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const PRICE = { actions_linux: .006, actions_windows: .010, actions_macos: .062, actions_linux_16_core: .042, actions_storage: .25 / 720, codespaces_compute_d4: .36, codespaces_storage: .07 / 720, packages_storage: .25 / 720, packages_bandwidth: .5, copilot_for_business: 19 };
  const PRODUCT = { Actions: ['actions_linux', 'actions_windows', 'actions_macos', 'actions_linux_16_core', 'actions_storage'], Codespaces: ['codespaces_compute_d4', 'codespaces_storage'], Packages: ['packages_storage', 'packages_bandwidth'], Copilot: ['copilot_for_business', 'copilot_ai_credit'] };
  const productOf = sku => Object.keys(PRODUCT).find(p => PRODUCT[p].includes(sku));
  const UNIT = { actions_linux: 'minutes', actions_windows: 'minutes', actions_macos: 'minutes', actions_linux_16_core: 'minutes', actions_storage: 'GigabyteHours', codespaces_compute_d4: 'Hours', codespaces_storage: 'GigabyteHours', packages_storage: 'GigabyteHours', packages_bandwidth: 'GigaBytes', copilot_for_business: 'UserMonths' };
  const REPOS = [
    ['acme-web', 'storefront', { linux: [300, 900], gb: 20, cs: [6, 16] }],
    ['acme-web', 'checkout', { linux: [200, 600], windows: [100, 300], gb: 8 }],
    ['acme-web', 'design-system', { linux: [100, 400], gb: 4 }],
    ['acme-data', 'etl', { linux: [400, 1200], windows: [50, 150], gb: 30, cs: [4, 10] }],
    ['acme-data', 'ml-models', { linux: [100, 300], l16: [60, 200], gb: 60 }],
    ['acme-platform', 'infra', { linux: [500, 1500], gb: 12 }],
    ['acme-platform', 'sdk-ios', { linux: [100, 300], macos: [250, 700], gb: 15 }],
    ['acme-sandbox', 'experiments', { linux: [100, 500], gb: 40 }],
  ];
  const SEATS = { 'acme-web': 40, 'acme-data': 15, 'acme-platform': 25, 'acme-sandbox': 5 };

  function build() {
    const rand = rng(42), between = ([a, b]) => Math.round(a + rand() * (b - a));
    const items = [];
    let includedCompute = 300; // ponytail: model one shared compute allowance; storage allowances and other discounts are excluded.
    const add = (day, sku, quantity, org, repo = '') => {
      const grossAmount = r2(quantity * PRICE[sku]), discountAmount = UNIT[sku] === 'minutes' ? Math.min(includedCompute, grossAmount) : 0;
      includedCompute = r2(includedCompute - discountAmount);
      items.push({ date: `2026-09-${String(day).padStart(2, '0')}T00:00:00Z`, product: productOf(sku), sku, quantity, unitType: UNIT[sku], pricePerUnit: PRICE[sku], grossAmount, discountAmount, netAmount: r2(grossAmount - discountAmount), organizationName: org, repositoryName: repo ? `${org}/${repo}` : '' });
    };
    for (let d = 1; d <= 30; d++) {
      for (const [org, repo, c] of REPOS) {
        add(d, 'actions_linux', between(c.linux), org, repo);
        if (c.windows) add(d, 'actions_windows', between(c.windows), org, repo);
        if (c.macos) add(d, 'actions_macos', between(c.macos), org, repo);
        if (c.l16) add(d, 'actions_linux_16_core', between(c.l16), org, repo);
        add(d, 'actions_storage', (c.gb + d * 0.5) * 24, org, repo);
        if (c.cs) { add(d, 'codespaces_compute_d4', between(c.cs), org, repo); add(d, 'codespaces_storage', 50 * 24, org, repo); }
      }
      add(d, 'packages_storage', 100 * 24, 'acme-web');
      add(d, 'packages_storage', 300 * 24, 'acme-platform');
      add(d, 'packages_bandwidth', between([1, 5]), 'acme-platform');
      if (d === 17) add(d, 'actions_linux', 6000, 'acme-sandbox', 'experiments'); // runaway cron, lab 6
    }
    for (const [org, n] of Object.entries(SEATS)) add(30, 'copilot_for_business', n, org);

    const ai = [], aiRand = rng(7);
    let included = Object.values(SEATS).reduce((a, b) => a + b, 0) * 1900;
    for (let d = 1; d <= 30; d++) for (const [model, lo, hi] of [['GPT-6.1 Terra', 3000, 6000], ['Claude Opus 4.8', 8000, 15000], ['Claude Haiku 4.5', 1000, 2000]]) {
      const grossQuantity = Math.round(lo + aiRand() * (hi - lo)), discountQuantity = Math.min(included, grossQuantity), netQuantity = grossQuantity - discountQuantity;
      included -= discountQuantity;
      const row = { date: `2026-09-${String(d).padStart(2, '0')}T00:00:00Z`, product: 'Copilot', sku: 'copilot_ai_credit', model, unitType: 'credits', pricePerUnit: 0.01, grossQuantity, grossAmount: r2(grossQuantity * .01), discountQuantity, discountAmount: r2(discountQuantity * .01), netQuantity, netAmount: r2(netQuantity * .01) };
      ai.push(row);
      items.push({ date: row.date, product: row.product, sku: row.sku, quantity: grossQuantity, unitType: row.unitType, pricePerUnit: row.pricePerUnit, grossAmount: row.grossAmount, discountAmount: row.discountAmount, netAmount: row.netAmount, organizationName: 'acme-web', repositoryName: '' });
    }

    const spendBy = org => r2(items.filter(i => i.organizationName === org).reduce((s, i) => s + i.netAmount, 0));
    const cc = [['Digital', 'acme-web', 0.9], ['Data', 'acme-data', 1.6], ['Platform', 'acme-platform', 1.1]];
    const costCenters = {
      _note: 'Shaped like GET /enterprises/{e}/settings/billing/cost-centers. monthlyBudgetUSD is a lab-only field (real budgets live under /settings/billing/budgets).',
      costCenters: cc.map(([name, org, f], i) => ({ id: `cc-${i + 1}`, name, state: 'active', monthlyBudgetUSD: Math.round(spendBy(org) * f / 100) * 100, resources: [{ type: 'Org', name: org }] })),
    };

    const seats = [];
    for (let i = 1; i <= 40; i++) {
      let last;
      if (i % 13 === 0) last = null; // no activity reported
      else if (i % 5 === 0 && i < 35) last = `2026-0${7 + (i % 2)}-${String(1 + (i % 18)).padStart(2, '0')}T10:00:00Z`; // stale (Jul / early Aug)
      else last = `2026-09-${String(5 + Math.floor(rand() * 25)).padStart(2, '0')}T10:00:00Z`;
      seats.push({ created_at: '2026-01-15T00:00:00Z', last_activity_at: last, last_activity_editor: last ? 'vscode' : null, plan_type: 'business', assignee: { login: `dev${String(i).padStart(2, '0')}`, type: 'User' } });
    }
    const C = (login, repo, lastPushAt, type = 'User') => ({ login, type, repo, lastPushAt });
    const commits = [C('dev01', 'storefront', '2026-09-20'), C('dev02', 'storefront', '2026-09-10'), C('dev03', 'storefront', '2026-06-01'), C('dev04', 'storefront', '2026-09-01'),
      C('dev01', 'checkout', '2026-09-15'), C('dev05', 'checkout', '2026-08-20'), C('dev06', 'checkout', '2026-09-25'),
      C('dev02', 'etl', '2026-09-05'), C('dev07', 'etl', '2026-09-12'), C('dev08', 'etl', '2026-08-01'), C('dev09', 'etl', '2026-05-15'), C('dev10', 'etl', '2026-07-10'), C('dependabot[bot]', 'etl', '2026-09-29', 'Bot'),
      C('dev04', 'infra', '2026-09-02'), C('dev11', 'infra', '2026-09-28'), C('dev07', 'infra', '2026-06-10')];
    const ev = (day, action, actor, org, extra = {}) => ({ '@timestamp': Date.UTC(2026, 8, day), action, actor, org, ...extra });
    const audit = [ev(3, 'org.update_actions_settings', 'alice', 'acme-web'), ev(5, 'org.add_billing_manager', 'bob', 'acme-data', { user: 'carol' }),
      ev(9, 'org.set_actions_retention_limit', 'mallory', 'acme-sandbox', { retention_days: 400 }), ev(11, 'repo.create', 'dave', 'acme-web'),
      ev(14, 'org.set_default_workflow_permissions', 'alice', 'acme-platform'), ev(16, 'org.add_billing_manager', 'mallory', 'acme-sandbox', { user: 'mallory-alt' }),
      ev(21, 'org.set_actions_cache_storage_policy', 'bob', 'acme-data'), ev(25, 'team.add_member', 'erin', 'acme-web')];
    return {
      'audit-log.json': { _note: 'Synthetic enterprise audit-log events, wrapped in an events array for the lab. Approved billing admins: alice, bob.', events: audit },
      'ai-usage.json': { _note: 'Synthetic org AI-credit report with a lab-only date on each row and arbitrary model usage, not historical availability or model prices. The enterprise has 85 distinct, full-month Business seats and a shared pool of 161,500 credits; all sample AI usage is attributed to acme-web. The same charges are included in usage.json.', usageItems: ai },
      'security-committers.json': { _note: 'Synthetic: latest push per eligible Team/Enterprise-licensed committer per repo with the same security product enabled. "Today" is 2026-09-30.', commits },
      'usage.json': { _note: 'Synthetic September 2026 enterprise-wide data, using normalized product/SKU identifiers; actual API labels can differ. Rates were checked 2026-11-12, not established historical prices. The sample applies $300 shared compute and 161,500 AI credits, but omits storage and transfer allowances, other discounts and tax; each line is rounded to cents. AI charges are also broken down in ai-usage.json; do not add them twice.', usageItems: items },
      'cost-centers.json': costCenters,
      'seats.json': { _note: 'Synthetic sample shaped like GET /orgs/acme-web/copilot/billing/seats. "Today" is 2026-09-30.', total_seats: seats.length, seats },
    };
  }

  const sum = a => a.reduce((s, i) => s + i.netAmount, 0);
  const D = 'https://docs.github.com/en';
  const B = 'https://github.blog';
  const labs = [
    { id: 'setup', title: 'Set up your lab', mins: 5,
      why: 'GitHub exposes billing data through REST APIs. Practise on a synthetic enterprise-wide dataset, then inspect your own org’s output before adapting the commands. The sample uses normalized SKU identifiers; live reports may return display names such as <code>Actions Linux</code>.',
      steps: ['Create a folder and download the lab files using the buttons below (they are generated in your browser, fully offline).', 'Open a terminal in that folder and confirm the tools: <code>gh --version</code> and <code>jq --version</code>.', 'Peek at one usage line item — note <code>grossAmount</code>, <code>discountAmount</code>, <code>netAmount</code>, <code>sku</code>, <code>repositoryName</code>:', { cmd: "jq '.usageItems[0]' usage.json" }, 'Inspect product, SKU and unit labels before filtering a real report:', { cmd: "jq -r '.usageItems[] | [.product, .sku, .unitType] | @tsv' usage.json | sort -u" }],
      q: 'How many usage line items are in usage.json?', type: 'number', answer: d => d['usage.json'].usageItems.length,
      solution: "jq '.usageItems | length' usage.json",
      takeaway: 'The org usage API returns line items. The enterprise <code>/usage</code> endpoint defaults to unallocated usage only; <code>/usage/summary</code> covers all cost centers but returns aggregates, not the sample’s daily repository rows.',
      real: '# Replace the month and names for your account; use new filenames to keep the lab samples.\ngh api -H "X-GitHub-Api-Version: 2026-03-10" "/organizations/YOUR_ORG/settings/billing/usage?year=2026&month=9" > org-usage.json\n# Enterprise-wide aggregate (different shape):\ngh api -H "X-GitHub-Api-Version: 2026-03-10" "/enterprises/YOUR_ENTERPRISE/settings/billing/usage/summary?year=2026&month=9" > enterprise-summary.json\n# For enterprise daily rows, query /usage per cost_center_id and separately for unallocated usage.',
      src: [['REST: Org billing usage', `${D}/rest/billing/usage`], ['REST: Enterprise billing usage', `${D}/enterprise-cloud@latest/rest/billing/usage`], ['Usage reporting tutorial', `${D}/enterprise-cloud@latest/billing/tutorials/automate-usage-reporting`], ['GitHub Product and SKU names', `${D}/billing/reference/product-and-sku-names`]] },

    { id: 'bill', title: 'Read the bill (gross vs net)', mins: 10,
      why: 'Gross is the usage value before discounts; included usage and other discounts reduce it to net. Net is the reported billable amount, not necessarily the final invoice after contract terms or tax.',
      steps: ['Sum gross, discount and net in one pass:', { cmd: "jq '.usageItems | {gross: (map(.grossAmount)|add), discount: (map(.discountAmount)|add), net: (map(.netAmount)|add)}' usage.json" }, 'Which SKU got discounted, and on which days? Find out:', { cmd: "jq '[.usageItems[] | select(.discountAmount > 0) | {date: .date[:10], sku}] | unique' usage.json" }],
      q: 'What is the total NET spend for September (USD)?', type: 'number', answer: d => sum(d['usage.json'].usageItems),
      solution: "jq '[.usageItems[].netAmount] | add' usage.json",
      takeaway: 'This sample models a shared $300 Enterprise Cloud compute allowance and an AI-credit pool, but omits storage/transfer allowances and other discounts. A spend jump can reflect an exhausted allowance or a real usage change; investigate both.',
      real: 'gh api -H "X-GitHub-Api-Version: 2026-03-10" "/enterprises/YOUR_ENTERPRISE/settings/billing/usage/summary" | jq .',
      src: [['Actions billing and included compute', `${D}/billing/concepts/product-billing/github-actions`], ['Billing reports reference', `${D}/billing/reference/billing-reports`]] },

    { id: 'product', title: 'Where does the money go?', mins: 10,
      why: 'FinOps Inform phase: break spend down by product before optimizing anything. Optimizing a product that is 3% of the bill is a waste of engineering time.',
      steps: ['Group net spend by product, largest first:', { cmd: "jq '.usageItems | group_by(.product) | map({product: .[0].product, net: (map(.netAmount)|add)}) | sort_by(-.net)' usage.json" }, 'Now go one level deeper — by SKU:', { cmd: "jq '.usageItems | group_by(.sku) | map({sku: .[0].sku, net: (map(.netAmount)|add|.*100|round/100)}) | sort_by(-.net)' usage.json" }],
      q: 'Which product has the highest net spend? (actions / codespaces / packages / copilot)', type: 'text',
      answer: d => Object.entries(d['usage.json'].usageItems.reduce((m, i) => (m[i.product] = (m[i.product] || 0) + i.netAmount, m), {})).sort((a, b) => b[1] - a[1])[0][0],
      solution: "jq -r '.usageItems | group_by(.product) | map({product: .[0].product, net: (map(.netAmount)|add)}) | max_by(.net) | .product' usage.json",
      takeaway: 'Rank first, then investigate the largest lines. The AI-credit breakdown in ai-usage.json is already included in this sample’s usage.json; do not add it again.',
      real: 'gh api -H "X-GitHub-Api-Version: 2026-03-10" "/organizations/YOUR_ORG/settings/billing/usage?year=2026&month=9" \\\n  | jq \'.usageItems | group_by(.product) | map({product: .[0].product, net: (map(.netAmount)|add)}) | sort_by(-.net)\'',
      src: [['FinOps Framework', 'https://www.finops.org/framework/'], ['Actions Usage Metrics GA', `${B}/changelog/2024-07-25-actions-usage-metrics-is-generally-available`]] },

    { id: 'alloc', title: 'Allocation & cost centers', mins: 15,
      why: 'Unallocated spend has no owner, so nobody optimizes it. Cost centers map orgs, repos and users to a business owner. Course heuristic (not a GitHub rule): aim for >90% of spend allocated.',
      steps: ['List which orgs each cost center owns:', { cmd: "jq '.costCenters[] | {name, orgs: [.resources[].name]}' cost-centers.json" }, 'List all orgs that appear on the bill and compare:', { cmd: "jq '[.usageItems[].organizationName] | unique' usage.json" }, 'Join the two files to compute the unallocated share (note <code>--slurpfile</code> and <code>IN</code>):', { cmd: "jq -n --slurpfile u usage.json --slurpfile c cost-centers.json '\n  ([$c[0].costCenters[].resources[].name]) as $mapped\n  | ($u[0].usageItems | map(.netAmount) | add) as $total\n  | ($u[0].usageItems | map(select((.organizationName | IN($mapped[])) | not)) | map(.netAmount) | add) as $unalloc\n  | {unallocated: $unalloc, pct: ($unalloc / $total * 100)}'" }, '<b>History matters:</b> this simplified join assumes org-only mappings. GitHub also allocates by repo, user and enterprise team. Changes affect future usage; unassigned usage is <b>“Enterprise Only”</b>. Direct user assignment takes precedence over team assignment. For past months, use the cost center recorded in the detailed billing report, available in the UI or via enterprise report export.'],
      q: 'What % of net spend is NOT covered by any cost center? (e.g. 4.2)', type: 'number',
      answer: d => { const m = d['cost-centers.json'].costCenters.flatMap(c => c.resources.map(r => r.name)), u = d['usage.json'].usageItems; return sum(u.filter(i => !m.includes(i.organizationName))) / sum(u) * 100; },
      solution: "jq -n --slurpfile u usage.json --slurpfile c cost-centers.json '([$c[0].costCenters[].resources[].name]) as $m | ($u[0].usageItems | map(.netAmount) | add) as $t | ($u[0].usageItems | map(select((.organizationName | IN($m[])) | not)) | map(.netAmount) | add) / $t * 100'",
      takeaway: 'Assign the sandbox to an owner. Cost centers are for enterprise metered billing; use user-level AI budgets and, where eligible, cost-center included-usage controls separately.',
      real: 'gh api -H "X-GitHub-Api-Version: 2026-03-10" /enterprises/YOUR_ENTERPRISE/settings/billing/cost-centers | jq \'.costCenters[] | {name, resources}\'\n# Current membership, not historical attribution:\ngh api -G -H "X-GitHub-Api-Version: 2026-03-10" /enterprises/YOUR_ENTERPRISE/settings/billing/cost-centers/memberships -f resource_type=organization -f name=YOUR_ORG | jq .',
      src: [['Cost center allocation rules', `${D}/billing/reference/cost-center-allocation`], ['REST: Cost centers', `${D}/enterprise-cloud@latest/rest/billing/cost-centers`], ['REST: Usage report exports', `${D}/enterprise-cloud@latest/rest/billing/usage-reports`]] },

    { id: 'forecast', title: 'Forecast before the month ends', mins: 10,
      why: 'A run-rate forecast (month-to-date ÷ days elapsed × days in month) is a starting point, not a prediction of spikes, seasonality or allowance exhaustion.',
      steps: ['Pretend today is <b>2026-09-20</b>. Compute Actions month-to-date net spend (note <code>.date[:10]</code> — dates are ISO timestamps):', { cmd: "jq '[.usageItems[] | select((.product | ascii_downcase)==\"actions\" and .date[:10] <= \"2026-09-20\") | .netAmount] | add' usage.json" }, 'Turn it into a 30-day run-rate forecast:', { cmd: "jq '[.usageItems[] | select((.product | ascii_downcase)==\"actions\" and .date[:10] <= \"2026-09-20\") | .netAmount] | add / 20 * 30' usage.json" }, 'Compare with the whole month. How do the shared compute allowance and the spike in lab 6 affect the forecast?'],
      q: 'What is the run-rate forecast for September Actions spend (USD)?', type: 'number',
      answer: d => sum(d['usage.json'].usageItems.filter(i => i.product === 'Actions' && i.date.slice(0, 10) <= '2026-09-20')) / 20 * 30,
      solution: "jq '[.usageItems[] | select((.product | ascii_downcase)==\"actions\" and .date[:10] <= \"2026-09-20\") | .netAmount] | add / 20 * 30' usage.json",
      takeaway: 'GitHub’s optional budget alerts use 75/90/100% thresholds. For supported metered budgets, choose whether to stop usage; a newly created budget only counts usage after creation in its first cycle.',
      real: '# Repeat with page=2, 3, ... while has_next_page is true.\ngh api -H "X-GitHub-Api-Version: 2026-03-10" "/enterprises/YOUR_ENTERPRISE/settings/billing/budgets?per_page=100&page=1" | jq \'{budgets, has_next_page, total_count}\'',
      src: [['Docs: budgets and alerts', `${D}/billing/concepts/budgets-and-alerts`], ['REST: Budgets', `${D}/enterprise-cloud@latest/rest/billing/budgets`]] },

    { id: 'actions', title: 'Actions hotspot & runner what-if', mins: 20,
      why: 'Runner choice affects Actions cost: in this sample, macOS costs about 10.3× Linux per minute. Standard runners on public repos and self-hosted runners are free; larger runners are billed even on public repos.',
      steps: ['Find the most expensive repo for Actions compute:', { cmd: "jq '.usageItems | map(select((.product | ascii_downcase)==\"actions\" and (.unitType | ascii_downcase)==\"minutes\")) | group_by(.repositoryName) | map({repo: .[0].repositoryName, net: (map(.netAmount)|add)}) | sort_by(-.net) | .[:3]' usage.json" }, 'Break that repo down by SKU — which runner is the culprit?', { cmd: "jq '.usageItems | map(select(.repositoryName==\"acme-platform/sdk-ios\" and (.unitType | ascii_downcase)==\"minutes\")) | group_by(.sku) | map({sku: .[0].sku, minutes: (map(.quantity)|add), net: (map(.netAmount)|add)})' usage.json" }, 'What-if: move 50% of macOS minutes to Linux, assuming equal runtimes. Calculate the <b>gross, pre-discount</b> rate difference; the actual bill saving also depends on the shared allowance.', '<b>Self-hosted TCO:</b> compare hosted Linux net spend with an illustrative $600/month infrastructure plus 8 engineer-hours at $100/h. This simplified comparison ignores changes in shared-allowance allocation:', { cmd: "jq '([.usageItems[] | select(.sku==\"actions_linux\") | .netAmount] | add) as $hosted | (600 + 8*100) as $self | {hosted: $hosted, selfHosted: $self, verdict: (if $hosted > $self then \"self-hosted may pay off\" else \"stay hosted\" end)}' usage.json" }, 'As of the documentation check, Linux ARM is $0.005/min and <code>ubuntu-slim</code> is $0.002/min for private usage before allowances. Slim is an unprivileged container with a 15-minute job limit; verify compatibility and current prices.'],
      q: 'Gross rate-based monthly difference (USD) from moving 50% of sdk-ios macOS minutes to Linux?', type: 'number',
      answer: d => { const u = d['usage.json'].usageItems, mins = u.filter(i => i.repositoryName === 'acme-platform/sdk-ios' && i.sku === 'actions_macos').reduce((s, i) => s + i.quantity, 0); return mins * 0.5 * (PRICE.actions_macos - PRICE.actions_linux); },
      solution: "jq '([.usageItems[] | select(.sku==\"actions_linux\")][0].pricePerUnit) as $lin | ([.usageItems[] | select(.repositoryName==\"acme-platform/sdk-ios\" and .sku==\"actions_macos\")]) as $mac | ($mac | map(.quantity) | add) * 0.5 * ($mac[0].pricePerUnit - $lin)' usage.json",
      takeaway: 'Other high-leverage Actions fixes: concurrency groups with cancel-in-progress, path filters, caching, timeout-minutes on every job, and right-sizing larger runners. Measure with Actions Usage Metrics before and after.',
      real: '# per-repo Actions compute spend for your org\ngh api -H "X-GitHub-Api-Version: 2026-03-10" "/organizations/YOUR_ORG/settings/billing/usage?year=2026&month=9" \\\n  | jq \'.usageItems | map(select((.product | ascii_downcase)=="actions" and (.unitType | ascii_downcase)=="minutes")) | group_by(.repositoryName) | map({repo: .[0].repositoryName, net: (map(.netAmount)|add)}) | sort_by(-.net) | .[:10]\'',
      src: [['Actions billing', `${D}/billing/concepts/product-billing/github-actions`], ['Actions runner pricing', `${D}/billing/reference/actions-runner-pricing`], ['Hosted runner limits', `${D}/actions/reference/runners/github-hosted-runners`], ['Product and SKU identifiers', `${D}/billing/reference/product-and-sku-names`]] },

    { id: 'anomaly', title: 'Catch runaway spend', mins: 15,
      why: 'Budgets and run-rate forecasts assume steady usage. Real incidents are spikes: a cron set to every minute, recursive triggers, a matrix explosion, retry loops. Catch them in days, not at month end.',
      steps: ['Compute each repo’s daily Actions spend and flag any day above 3× that repo’s daily average:', { cmd: "jq -r '.usageItems | map(select((.product | ascii_downcase)==\"actions\")) | group_by(.repositoryName) | map(group_by(.date) | map({repo: .[0].repositoryName, date: .[0].date[:10], net: (map(.netAmount)|add)})) | map((map(.net)|add/length) as $avg | .[] | select(.net > 3 * $avg)) | .[] | \"\\(.repo) \\(.date) $\\(.net)\"' usage.json" }, 'Containment, in order: disable the workflow (<code>gh workflow disable</code>), cancel queued/running runs (<code>gh run cancel</code>), then find the trigger. Raising the budget is not a fix.'],
      q: 'Which repo spiked, and on what date? (format: repo,YYYY-MM-DD)', type: 'list',
      answer: d => { const m = {}; d['usage.json'].usageItems.filter(i => i.product === 'Actions').forEach(i => { const r = m[i.repositoryName] ??= {}; r[i.date] = (r[i.date] || 0) + i.netAmount; }); return Object.entries(m).flatMap(([repo, days]) => { const v = Object.values(days), avg = v.reduce((a, b) => a + b) / v.length; return Object.entries(days).filter(([, n]) => n > 3 * avg).map(([dt]) => `${repo},${dt.slice(0, 10)}`); }).join(','); },
      solution: "jq -r '.usageItems | map(select((.product | ascii_downcase)==\"actions\")) | group_by(.repositoryName) | map(group_by(.date) | map({repo: .[0].repositoryName, date: .[0].date[:10], net: (map(.netAmount)|add)})) | map((map(.net)|add/length) as $avg | .[] | select(.net > 3 * $avg)) | .[] | \"\\(.repo),\\(.date)\"' usage.json",
      takeaway: 'Check routinely, not just monthly. Use <code>timeout-minutes</code>, <code>concurrency</code> + <code>cancel-in-progress</code>, sensible cron schedules, and enforced Actions budgets where appropriate.',
      real: '# find the noisy workflow in the spiking repo\ngh run list -R YOUR_ORG/REPO --limit 100 --json workflowName,event,createdAt \\\n  | jq \'group_by(.workflowName) | map({wf: .[0].workflowName, runs: length}) | sort_by(-.runs)\'',
      src: [['Actions Usage Metrics GA', `${B}/changelog/2024-07-25-actions-usage-metrics-is-generally-available`], ['Docs: budgets and alerts', `${D}/billing/tutorials/set-up-budgets`]] },

    { id: 'storage', title: 'Storage: the silent cost', mins: 10,
      why: 'Artifacts, caches, packages and stopped codespaces can accumulate storage usage. GitHub measures Actions storage hourly; deleting an artifact stops future accrual but does not erase charges already accrued.',
      steps: ['Find all storage-type lines and total them. The sample omits storage allowances:', { cmd: "jq '.usageItems | map(select(.unitType==\"GigabyteHours\")) | group_by(.sku) | map({sku: .[0].sku, net: (map(.netAmount)|add)})' usage.json" }, 'Is Actions storage growing day over day? Check one repo:', { cmd: "jq -r '.usageItems[] | select(.sku==\"actions_storage\" and .repositoryName==\"acme-data/ml-models\") | \"\\(.date[:10]) \\(.quantity)\"' usage.json | head -5" }, '<b>Transfer rules:</b> what counts toward usage? (a) Actions pulls a private npm package with <code>GITHUB_TOKEN</code>; (b) a laptop pulls it with a PAT; (c) CI checks out a repo with a 500 MB Git LFS object; (d) someone pushes a 1-byte change to that object.<details><summary>Answer</summary>(b) Counts as Packages transfer, (c) counts as LFS bandwidth if LFS is downloaded, and (d) creates another full 500 MB LFS object. These consume included allowances before any overage charge. (a) Is free: downloads using <code>GITHUB_TOKEN</code> in Actions do not count; a PAT on a self-hosted runner can count.</details>'],
      q: 'Total net spend on storage (all GigabyteHours SKUs), USD?', type: 'number',
      answer: d => sum(d['usage.json'].usageItems.filter(i => i.unitType === 'GigabyteHours')),
      solution: "jq '[.usageItems[] | select(.unitType==\"GigabyteHours\") | .netAmount] | add' usage.json",
      takeaway: 'Actions artifacts and Packages share an allowance; cache has a separate 10 GB per-repository allowance. Set artifact retention, review stale packages, and set Codespaces idle timeout and retention.',
      real: '# biggest Actions caches in a repo\ngh cache list -R YOUR_ORG/YOUR_REPO --sort size_in_bytes --limit 10',
      src: [['Actions storage billing', `${D}/billing/concepts/product-billing/github-actions`], ['Codespaces billing', `${D}/billing/concepts/product-billing/github-codespaces`], ['Packages billing', `${D}/billing/concepts/product-billing/github-packages`], ['Git LFS billing', `${D}/billing/concepts/product-billing/git-lfs`]] },

    { id: 'copilot', title: 'Copilot seat hygiene', mins: 15,
      why: 'Copilot Business and Enterprise charge for assigned seats whether used or not. Eligible enterprises may instead opt into Copilot access; its pricing, rollout and included credits differ.',
      steps: ['seats.json is acme-web’s seat list. "Today" is 2026-09-30. Count candidates with no reported activity in 30 days (including null <code>last_activity_at</code>):', { cmd: "jq --arg cutoff \"2026-08-31T00:00:00Z\" '[.seats[] | select(.last_activity_at == null or .last_activity_at < $cutoff)] | length' seats.json" }, 'List them for the owner to review:', { cmd: "jq -r --arg cutoff \"2026-08-31T00:00:00Z\" '.seats[] | select(.last_activity_at == null or .last_activity_at < $cutoff) | \"\\(.assignee.login)\\t\\(.last_activity_at // \"not reported\")\"' seats.json" }, 'Find the sample Business seat price from usage.json and compute the <b>gross seat-fee</b> reduction, assuming those users have no other assignments in the enterprise.', '<b>Billing caveats:</b> removals take effect at the end of the current cycle; a user assigned in multiple enterprise orgs is billed once. An org list alone does not establish all enterprise assignments. <code>last_activity_at</code> requires IDE telemetry, so null is not proof of inactivity. Confirm with users. Removing each Business seat also reduces the next-cycle pool by 1,900 AI credits, potentially increasing overage.'],
      q: 'Gross monthly seat-fee reduction (USD), next cycle, if acme-web removes all candidates with no other assignments?', type: 'number',
      answer: d => d['seats.json'].seats.filter(s => !s.last_activity_at || s.last_activity_at < '2026-08-31T00:00:00Z').length * PRICE.copilot_for_business,
      solution: "jq -n --slurpfile s seats.json --slurpfile u usage.json '([$u[0].usageItems[] | select(.sku==\"copilot_for_business\")][0].pricePerUnit) * ([$s[0].seats[] | select(.last_activity_at == null or .last_activity_at < \"2026-08-31T00:00:00Z\")] | length)'",
      takeaway: 'Review before unassigning; estimate any change to paid AI usage as well as seat fees. Business is $19 per user/month and 1,900 credits per seat; Enterprise is $39 per user/month and 3,900. Eligible enterprises can opt into Copilot access: $0 incremental seat charge with Enterprise Cloud, or $10 per user/month for Standalone, with no included credits. Rollout is limited and the model cannot be mixed with Business/Enterprise in one enterprise.',
      real: 'gh api --paginate /orgs/YOUR_ORG/copilot/billing/seats --jq \'.seats[]\' | jq -s \'{seats: .}\'',
      src: [['Copilot seats and billing cycles', `${D}/copilot/concepts/billing-and-usage/organizations-and-enterprises/seats-and-billing-cycles`], ['Copilot access eligibility and rollout', `${D}/copilot/get-started/whats-changing-with-github-enterprise-and-copilot`], ['REST: Copilot user management', `${D}/rest/copilot/copilot-user-management`]] },

    { id: 'ai', title: 'Copilot AI credits by model', mins: 15,
      why: 'AI-credit consumption varies by model and tokens. In the sample, 85 distinct Business seats provide 161,500 pooled credits; usage after the pool is charged at $0.01 per credit, assuming additional usage is enabled.',
      steps: ['When did the sample’s included credits run out? The daily <code>date</code> field is added for this exercise; the real AI-credit report is aggregated.', { cmd: "jq -r '[.usageItems[] | select(.netQuantity > 0)][0].date[:10]' ai-usage.json" }, 'Paid (net) spend by model:', { cmd: "jq '.usageItems | group_by(.model) | map({model: .[0].model, credits: (map(.grossQuantity)|add), paid: (map(.netAmount)|add)}) | sort_by(-.paid)' ai-usage.json" }, 'The sample’s usage.json already includes these AI charges. Ranking paid amounts also depends on which model used the included pool, so it is not a measure of model efficiency.'],
      q: 'Which model drives the most paid AI-credit spend?', type: 'text',
      answer: d => Object.entries(d['ai-usage.json'].usageItems.reduce((m, i) => (m[i.model] = (m[i.model] || 0) + i.netAmount, m), {})).sort((a, b) => b[1] - a[1])[0][0],
      solution: "jq -r '.usageItems | group_by(.model) | map({model: .[0].model, paid: (map(.netAmount)|add)}) | max_by(.paid) | .model' ai-usage.json",
      takeaway: 'Paid overage is not automatic: policies or budgets can block it. User budgets hard-stop and include pooled consumption; other scopes require enforcement to stop spending. Inline completions remain available, and code review also consumes Actions compute.',
      real: 'gh api -H "X-GitHub-Api-Version: 2026-03-10" "/organizations/YOUR_ORG/settings/billing/ai_credit/usage?year=2026&month=9" | jq \'.usageItems | group_by(.model) | map({model: .[0].model, paid: (map(.netAmount)|add)})\'',
      src: [['Copilot billing and AI credits', `${D}/copilot/concepts/billing-and-usage/organizations-and-enterprises/billing`], ['Copilot budgets', `${D}/copilot/concepts/billing-and-usage/organizations-and-enterprises/budgets`], ['REST: AI credit usage', `${D}/rest/billing/usage#get-billing-ai-credit-usage-report-for-an-organization`], ['Actions billing', `${D}/billing/concepts/product-billing/github-actions`]] },

    { id: 'ghas', title: 'Advanced Security licences', mins: 15,
      why: 'Secret Protection and Code Security each count eligible unique active committers separately across that product’s enabled repos. A committer can count for both products. GitHub App bots are ignored.',
      steps: ['Count billable committers (active since 2026-07-02, GitHub App bots ignored):', { cmd: "jq --arg c 2026-07-02 '[.commits[] | select(.type==\"User\" and .lastPushAt >= $c) | .login] | unique | length' security-committers.json" }, 'What-if: disable Code Security on <code>etl</code>. Which licences are freed? Only committers active on etl and on no other enabled repo:', { cmd: "jq --arg c 2026-07-02 '[.commits[] | select(.type==\"User\" and .lastPushAt >= $c)] as $a | ([$a[] | select(.repo==\"etl\") | .login] - [$a[] | select(.repo!=\"etl\") | .login]) | unique' security-committers.json" }, 'Note dev07: last push to infra is stale, so etl is their only active repo.'],
      q: 'How many licences would disabling etl free?', type: 'number',
      answer: d => { const a = d['security-committers.json'].commits.filter(c => c.type === 'User' && c.lastPushAt >= '2026-07-02'), other = new Set(a.filter(c => c.repo !== 'etl').map(c => c.login)); return new Set(a.filter(c => c.repo === 'etl' && !other.has(c.login)).map(c => c.login)).size; },
      solution: "jq --arg c 2026-07-02 '[.commits[] | select(.type==\"User\" and .lastPushAt >= $c)] as $a | ([$a[] | select(.repo==\"etl\") | .login] - [$a[] | select(.repo!=\"etl\") | .login]) | unique | length' security-committers.json",
      takeaway: 'The sample models one product only. On metered billing, reduced active committers can lower a later bill; on volume/subscription billing they create headroom. A hard licence budget prevents new enablement, not extra charges from repos already enabled. Public repos have free security features, but some security AI features consume credits.',
      real: '# Org → Settings → Advanced Security → Global settings shows active and unique committers per repo',
      src: [['Docs: Advanced Security billing', `${D}/billing/concepts/product-billing/github-advanced-security`]] },

    { id: 'guardrails', title: 'Admin guardrails & audit', mins: 20,
      why: 'Cost controls only hold if few people can change them and every change is visible. GitHub’s enterprise guidance: least privilege via teams and custom roles, Actions policies set centrally, and audit logs reviewed and retained.',
      steps: ['Approved billing admins are <b>alice</b> and <b>bob</b>. List the sample’s billing-manager and Actions retention/cache/workflow-permission events:', { cmd: "jq -r '.events[] | select(.action | test(\"billing_manager|actions_|workflow_permission\")) | \"\\(.[\"@timestamp\"]/1000|todate[:10]) \\(.actor) \\(.action) \\(.org)\"' audit-log.json" }, 'Flag changes made by anyone outside the approved list:', { cmd: "jq -r '[.events[] | select((.action | test(\"billing_manager|actions_|workflow_permission\")) and (.actor | IN(\"alice\",\"bob\") | not)) | .actor] | unique[]' audit-log.json" }, 'Review unexpected billing managers and Actions policies, default <code>GITHUB_TOKEN</code> permissions, retention limits, and audit-log streaming. This sample filter is not an exhaustive audit.'],
      q: 'Which actor made unapproved cost-relevant changes?', type: 'text',
      answer: d => [...new Set(d['audit-log.json'].events.filter(e => /billing_manager|actions_|workflow_permission/.test(e.action) && !['alice', 'bob'].includes(e.actor)).map(e => e.actor))].join(','),
      solution: "jq -r '[.events[] | select((.action | test(\"billing_manager|actions_|workflow_permission\")) and (.actor | IN(\"alice\",\"bob\") | not)) | .actor] | unique | join(\",\")' audit-log.json",
      takeaway: 'Keep owners and billing managers few; grant access through teams (IdP-synced where possible) and custom roles. Enforce Actions, retention and PAT policies at enterprise level so orgs can’t loosen them, and alert on billing-manager and policy changes.',
      real: 'gh api "/enterprises/YOUR_ENTERPRISE/audit-log?phrase=action:org.add_billing_manager" --jq \'.[] | {actor, org, user}\'\ngh api /orgs/YOUR_ORG/actions/permissions             # allowed actions\ngh api /orgs/YOUR_ORG/actions/permissions/workflow    # default GITHUB_TOKEN permissions\ngh api /orgs/YOUR_ORG/actions/permissions/artifact-and-log-retention',
      src: [['Best practices for enterprises', `${D}/enterprise-cloud@latest/admin/overview/best-practices-for-enterprises`], ['Introducing Actions to your enterprise (governance)', `${D}/enterprise-cloud@latest/admin/managing-github-actions-for-your-enterprise/getting-started-with-github-actions-for-your-enterprise/introducing-github-actions-to-your-enterprise`], ['Audit log events for your enterprise', `${D}/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise`], ['REST: Actions permissions', `${D}/rest/actions/permissions`]] },

    { id: 'alert', title: 'Automate: budget alert script', mins: 20,
      why: 'Practise comparing a simulated finance target against the synthetic bill. This is not a GitHub budget: real budgets apply to specific products, SKUs or AI-credit bundles.',
      steps: ['Write <code>budget-check.sh</code>:', { cmd: "#!/usr/bin/env bash\nset -euo pipefail\njq -rn --slurpfile u usage.json --slurpfile c cost-centers.json '\n  $c[0].costCenters[] as $cc\n  | ([$cc.resources[].name]) as $orgs\n  | ([$u[0].usageItems[] | select(.organizationName | IN($orgs[])) | .netAmount] | add) as $spend\n  | select($spend >= 0.8 * $cc.monthlyBudgetUSD)\n  | \"⚠️  \\($cc.name): $\\($spend|floor) of $\\($cc.monthlyBudgetUSD) (\\($spend*100/$cc.monthlyBudgetUSD|floor)%)\"'" }, 'Run it: <code>bash budget-check.sh</code>', 'Before adapting it to live data, use the actual budget scope and product/SKU, paginate results, and read historical cost-center attribution from billing reports. The sample’s <code>monthlyBudgetUSD</code> and 80% threshold are fictional.'],
      q: 'Which cost centers are at ≥80% of budget? (comma-separated names)', type: 'list',
      answer: d => d['cost-centers.json'].costCenters.filter(c => sum(d['usage.json'].usageItems.filter(i => c.resources.some(r => r.name === i.organizationName))) >= 0.8 * c.monthlyBudgetUSD).map(c => c.name).join(','),
      solution: "jq -rn --slurpfile u usage.json --slurpfile c cost-centers.json '$c[0].costCenters[] as $cc | ([$cc.resources[].name]) as $orgs | ([$u[0].usageItems[] | select(.organizationName | IN($orgs[])) | .netAmount] | add) as $spend | select($spend >= 0.8 * $cc.monthlyBudgetUSD) | $cc.name'",
      takeaway: 'GitHub’s built-in budget alerts use 75/90/100%, not the sample’s 80%. Enterprise-installed GitHub Apps with Enterprise billing read access can retrieve supported billing data.',
      real: '# GitHub Apps can now read enterprise billing data:\n# https://github.blog/changelog/2026-08-26-github-apps-can-now-access-enterprise-billing-data/',
      src: [['GitHub Apps can access enterprise billing data', `${B}/changelog/2026-08-26-github-apps-can-now-access-enterprise-billing-data/`], ['GitHub budgets and alerts', `${D}/billing/concepts/budgets-and-alerts`], ['REST: Budgets', `${D}/enterprise-cloud@latest/rest/billing/budgets`]] },

    { id: 'capstone', title: 'Capstone: your real org', mins: 60,
      why: 'Repeat the labs on your own data. Your deliverable is a one-page FinOps snapshot you can hand to finance and engineering.',
      steps: ['Pull last month’s org usage or an enterprise summary using lab 0. Their shapes and scope differ; adapt the queries to your report.', 'Rank spend by product and, where available, by repo. Record the top 3 lines.', 'Measure allocation using the recorded cost center for that billing period, and find an owner for unallocated usage.', 'Forecast this month and review budget coverage, alerting and enforcement.', 'Pull AI-credit usage and Advanced Security committers; note the top model and count each security product separately.', '<b>Reconcile to the invoice:</b> classify metered usage, licence/seat, and prepaid/volume charges; note GitHub versus Azure payment. Totals can differ because of coverage, timing, credits or contract terms. Do not double-count the AI breakdown.', 'Pick ONE optimization with an estimated saving and state its assumptions (allowances, runtime, seat entitlements, or licence agreement).', 'Review the guardrails audit: approved billing admins, Actions policies, retention limits and audit-log streaming.', 'Write the snapshot: total net, top 3 drivers, allocation %, forecast vs budget, one optimization + owner + date.'],
      q: 'Type "done" when your one-page snapshot is written.', type: 'text', answer: () => 'done', solution: 'echo done',
      takeaway: 'FinOps is a loop, not a project: Inform → Optimize → Operate, every month.',
      real: '', src: [['FinOps Framework', 'https://www.finops.org/framework/'], ['GitHub billing docs', `${D}/billing`]] },
  ];

  labs.forEach((l, i) => l.title = `${i} · ${l.title}`);
  const norm = s => String(s).toLowerCase().replace(/[$%\s]/g, '').split(',').filter(Boolean).sort().join(',');
  function check(lab, input, data) {
    const want = lab.answer(data);
    if (lab.type === 'number') { const n = parseFloat(String(input).replace(/[$,%\s]/g, '')); return Number.isFinite(n) && Math.abs(n - want) <= Math.max(0.05, Math.abs(want) * 0.005); }
    return norm(input) === norm(want);
  }
  return { build, labs, check };
})();
if (typeof module !== 'undefined') module.exports = Core;
</script>

<script>
const KEY = 'gh-finops-labs-v1';
const DATA = Core.build();
const state = () => JSON.parse(localStorage.getItem(KEY) || '{"done":{},"cur":"setup"}');
const save = s => localStorage.setItem(KEY, JSON.stringify(s));
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pre = cmd => `<pre><button class="b" onclick="copy(this)">Copy</button><code>${esc(cmd)}</code></pre>`;
function copy(btn) { navigator.clipboard.writeText(btn.nextElementSibling.textContent); btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1200); }
function download(name) {
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([JSON.stringify(DATA[name], null, 2)], { type: 'application/json' })), download: name });
  a.click(); URL.revokeObjectURL(a.href);
}
const PAGES = 'https://ragmha.github.io/github-finops-course/';
// Deep link: new Copilot app session on this repo that opens the lab in the browser canvas.
const appLink = lab => 'https://github.com/copilot/app/launch?open=' + encodeURIComponent('ghapp://session/new?repo=ragmha%2Fgithub-finops-course&mode=interactive&prompt=' + encodeURIComponent(`Open the browser canvas at ${PAGES}#${lab.id} and coach me through the "${lab.title}" lab. Generate the lab files with \`node test.mjs data\`, then help me run each step in lab/ without revealing the answer unless I ask.`));
function go(id) { const s = state(); s.cur = id; save(s); history.replaceState(null, '', '#' + id); render(); scrollTo(0, 0); }
addEventListener('hashchange', () => go(location.hash.slice(1)));
if (Core.labs.some(l => l.id === location.hash.slice(1))) { const s = state(); s.cur = location.hash.slice(1); save(s); }
function submit(id) {
  const lab = Core.labs.find(l => l.id === id), v = document.getElementById('ans').value, out = document.getElementById('res');
  if (Core.check(lab, v, DATA)) { const s = state(); s.done[id] = true; save(s); render(); document.getElementById('res').innerHTML = '<span class="ok">✓ Correct — lab complete.</span>'; }
  else out.innerHTML = '<span class="bad">✗ Not quite. Re-check your filter, or reveal the solution.</span>';
}
function render() {
  const s = state(), labs = Core.labs, i = Math.max(0, labs.findIndex(l => l.id === s.cur)), lab = labs[i];
  const n = Object.keys(s.done).length;
  document.getElementById('prog').style.transform = `scaleX(${n / labs.length})`;
  document.getElementById('toc').innerHTML = labs.map(l => `<button class="${l.id === lab.id ? 'on' : ''} ${s.done[l.id] ? 'done' : ''}" onclick="go('${l.id}')">${l.title}</button>`).join('') + `<p style="margin-top:10px">${n}/${labs.length} complete</p>`;
  const steps = lab.steps.map(st => typeof st === 'string' ? `<li>${st}</li>` : pre(st.cmd)).join('');
  document.getElementById('main').innerHTML = `
    <h2>${lab.title}</h2><div class="meta">~${lab.mins} min ${s.done[lab.id] ? '· <span class="ok">completed</span>' : ''} · <a href="${appLink(lab)}">Open in GitHub Copilot app</a></div>
    <div class="card"><h3>Why it matters</h3>${lab.why}</div>
    ${lab.id === 'setup' ? `<div class="card"><h3>Lab files</h3>${Object.keys(DATA).map(f => `<button class="b p" onclick="download('${f}')">⬇ ${f}</button> `).join('')}<p class="meta" style="margin:8px 0 0">Synthetic data for a fictional enterprise “acme”, September 2026. Prices are illustrative — always check GitHub Docs.</p></div>` : ''}
    <div class="card"><h3>Do it</h3><ol>${steps}</ol></div>
    <div class="card"><h3>Check your answer</h3><p>${lab.q}</p>
      <input id="ans" onkeydown="if(event.key==='Enter')submit('${lab.id}')"> <button class="b p" onclick="submit('${lab.id}')">Check</button>
      <button class="b" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Show solution</button><div hidden>${pre(lab.solution)}</div>
      <p id="res"></p></div>
    <div class="card takeaway"><h3>Best practice</h3>${lab.takeaway}</div>
    ${lab.real ? `<div class="card real"><h3>Run it for real</h3>${pre(lab.real)}<p class="meta" style="margin:0">Replace example names and dates. Permissions and billing-platform eligibility depend on the endpoint. GitHub’s reporting tutorial and endpoint reference differ on fine-grained PAT support; see lab 0 and the README. Live authentication was not verified.</p></div>` : ''}
    <div class="card"><h3>Official sources</h3><ul>${lab.src.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join('')}</ul></div>
    <p>${i > 0 ? `<button class="b" onclick="go('${labs[i - 1].id}')">← Previous</button>` : ''} ${i < labs.length - 1 ? `<button class="b p" onclick="go('${labs[i + 1].id}')">Next →</button>` : ''}</p>`;
}
render();
</script>
</body>
</html>
